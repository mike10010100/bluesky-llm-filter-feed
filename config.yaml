service:
  handle: "example-labeler.bsky.social" # The handle of your labeler account
  did: "did:plc:example" # The DID of your labeler account (optional if handle provided, but recommended)
  provider: "ollama" # 'ollama' or 'openai' or 'anthropic'
  
llm:
  model: "llama3" # Model name (e.g., 'llama3', 'gpt-4o-mini')
  base_url: "http://localhost:11434" # For Ollama

filters:
  - id: "soccer-filter"
    label_value: "content:soccer"
    description: "Detects and labels posts about Association Football (Soccer)"
    trigger_words: 
      - "soccer"
      - "football"
      - "premier league"
      - "messi"
      - "ronaldo"
      - "offside"
      - "var"
    
    # Embedding-based triggers (Semantic Matching)
    # This catches "The beautiful game" even if "soccer" isn't mentioned.
    embeddings:
      enabled: true
      threshold: 0.5 # 0.0 to 1.0 (Cosine Similarity)
      triggers:
        - "A professional soccer match"
        - "The FIFA World Cup"
        - "Lionel Messi scoring a goal"
        - "The Premier League standings"

    prompt: "Is this post discussing the sport of Association Football (Soccer)? Ignore American Football (NFL). Answer with a single word: YES or NO."
    look_at_images: false
    confidence_threshold: 0.8
