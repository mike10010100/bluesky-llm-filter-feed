service:
  handle: "example-labeler.bsky.social"
  did: "did:plc:example"
  signingKey: "your-secret-signing-key-here"
  provider: "ollama" # 'ollama' or 'openai' or 'anthropic'
  
llm:
  model: "qwen3-vl:4b"
  # model: "qwen3-vl" # Uncomment for Multimodal (Vision) support
  base_url: "http://192.168.86.172:11434"

filters:
  - id: "soccer-filter"
    label_value: "content:soccer"
    description: "Detects and labels posts about Association Football (Soccer)"
    match_mode: "any" # 'any' (OR), 'all' (AND), 'keyword', 'embedding'
    
    trigger_words: 
      - "soccer"
      - "football"
      - "premier league"
      - "messi"
    
    embeddings:
      enabled: true
      force_check: false
      threshold: 0.35
      triggers:
        - "A professional soccer match"
        - "The FIFA World Cup"

    llm:
      prompt: "Is this post discussing the sport of Association Football (Soccer)? Ignore American Football (NFL). Answer with a single word: YES or NO."
      look_at_images: false
      confidence_threshold: 0.8